services:
  - type: web
    name: scolarecouv
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: scolarecouv-db
          property: connectionString
databases:
  - name: scolarecouv-db
    plan: free
    region: frankfurt
    databaseName: scolarecouv
    user: scolarecouv
    ipAllowList: []
